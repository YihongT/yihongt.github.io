- name: "Reef"
  owner: "Human-Agent-Society"
  repo: "reef"
  role: "Core Contributor"
  trending: true
  description: >-
    Open-source infrastructure enabling agents to continuously improve themselves by connecting
    inference, feedback collection, learning, and versioned deployment, evolving both model
    weights (via Slime, SGLang, etc.) and agent components such as prompts, rules, and skills.

- name: "CORAL"
  owner: "Human-Agent-Society"
  repo: "CORAL"
  role: "Core Contributor"
  trending: false
  description: >-
    Open-source infrastructure for autonomous multi-agent evolution: lets many coding agents
    (Claude Code, OpenCode, Codex, etc.) run experiments in isolated sandboxes, share evidence
    across the population, and continuously self-improve solutions to a task.

- name: "CoAutoResearch"
  owner: "YihongT"
  repo: "CoAutoResearch"
  role: ""
  trending: false
  description: >-
    A system for autonomous research experiments with human oversight: AI agents run iterative
    research trials, track evidence across attempts, and automatically draft research manuscripts
    from the recorded findings.
